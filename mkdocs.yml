site_name: gw
site_description: Manage git worktrees in a bare-repo layout
site_url: https://ffluk3.github.io/gw/
repo_url: https://github.com/ffluk3/gw
repo_name: ffluk3/gw
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Get started: tutorials/getting-started.md
  - How-to:
      - how-to/index.md
      - Create a layout: how-to/create-a-layout.md
      - Manage the repos root: how-to/manage-repos-root.md
      - Run from anywhere: how-to/run-from-anywhere.md
      - Open or reuse a worktree: how-to/add-worktree.md
      - Read the status table: how-to/read-status.md
      - Use JIRA: how-to/configure-jira.md
      - Use a convention recipe: how-to/convention-recipes.md
      - Remove worktrees: how-to/clean-worktrees.md
      - Restore a branch: how-to/restore-a-branch.md
      - Script with JSON: how-to/script-with-json.md
      - Use with agents: how-to/integrate-with-agents.md
  - Reference:
      - reference/index.md
      - Command line: reference/cli.md
      - Configuration: reference/configuration.md
      - Layout on disk: reference/layout.md
      - Exit codes: reference/exit-codes.md
      - JSON output: reference/json.md
      - Providers: reference/providers.md
  - User Manual:
      - explanation/index.md
      - Why one checkout per branch: explanation/why-worktree-layout.md
      - Is it safe to delete?: explanation/clean-safety.md
  - Developer Manual:
      - developer/index.md
      - Architecture notes: developer/architecture.md
      - The decision model: developer/decision-model.md
      - Repositories and discovery: developer/layout.md
      - Conventions and providers: developer/conventions.md
      - Testing and coverage: developer/testing.md
      - Writing the docs: developer/docs-style.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

strict: true
