name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The commit-msg hook catches bad messages locally. This job catches commits
  # made with --no-verify, and commits authored outside the hook.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Check the commits this branch adds, not the whole history. The base
      # SHA is the merge target's tip at the time the pull request opened.
      - name: Validate commit messages
        run: ./scripts/check-commit-message.sh --range "${{ github.event.pull_request.base.sha }}..HEAD"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh shell/gw.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: gw-linux-x86_64
          path: target/release/gw
