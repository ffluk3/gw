name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The commit-msg hook catches bad messages locally. This job catches commits
  # made with --no-verify, and commits authored outside the hook.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Check the commits this branch adds, not the whole history. The base
      # SHA is the merge target's tip at the time the pull request opened.
      - name: Validate commit messages
        run: ./scripts/check-commit-message.sh --range "${{ github.event.pull_request.base.sha }}..HEAD"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `llvm-tools-preview` is what cargo-llvm-cov instruments with. The
      # pinned toolchain's profile is `minimal`, so the component is requested
      # explicitly rather than assumed.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      # Run the same suite once more under instrumentation and fail below the
      # floor. cargo-llvm-cov merges the profiles written by the `gw` binary
      # that the end-to-end tests spawn, so this measures the command layer too.
      #
      # One OS is enough: the suite is not platform-specific, and installing the
      # tool on both runners doubles the job time for the same number.
      - name: Install coverage tool
        if: runner.os == 'Linux'
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --all --fail-under-lines 95

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh shell/gw.sh scripts/*.sh

      # The wrapper must work in zsh as well as bash, and zsh ties `path` to
      # `PATH`, which turns an ordinary `local path` into an emptied PATH.
      # Only a real zsh catches that, so run the cases in both shells.
      - name: Shell integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          ./scripts/test-shell-integration.sh target/debug/gw

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: gw-linux-x86_64
          path: target/release/gw
