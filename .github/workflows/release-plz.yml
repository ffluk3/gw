name: release-plz

on:
  push:
    branches: [main]

jobs:
  # Turn merged commits into a release pull request: the next workspace
  # version, the changelog for it, and the version bump in Cargo.toml.
  release-plz-pr:
    name: Prepare release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # release-plz reads the full commit history to build the changelog.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"

      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # When the release PR lands, tag the commit and create the GitHub release.
  # `git_only = true` in release-plz.toml means nothing is published to a
  # cargo registry.
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"

      - name: Run release-plz release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the gw binary for each supported platform and attach it to the
  # release that release-plz just created. `install.sh` downloads these
  # assets, and `install.sh --from-source` builds the same binary locally.
  upload-binaries:
    name: Upload ${{ matrix.target }}
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The x86_64 build uses the host compiler. The aarch64 musl target needs
      # a cross linker, which `cross` provides without host setup.
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == aarch64-unknown-linux-musl ]]; then
            cross build --release --target "$TARGET" -p gw
          else
            cargo build --release --target "$TARGET" -p gw
          fi

      # Pick the tag for the gw package. release-plz reports an entry for every
      # package it considered, and it fills in a tag even for packages with
      # `git_tag_enable = false` (gw-core), where no tag or release exists.
      # Selecting the first non-null tag therefore points at a release that was
      # never created. Select gw by name instead.
      - name: Resolve release tag
        id: tag
        env:
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$RELEASES" \
            | jq -r '[.[] | select(.package_name == "gw" and .tag != null)][0].tag // empty')"
          [[ -n "$tag" ]] || {
            echo "no release tag found for package gw in: $RELEASES" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          name="gw-${TAG}-${TARGET}"
          stage="$(mktemp -d)"
          install -m 0755 "target/${TARGET}/release/gw" "$stage/gw"
          install -m 0644 shell/gw.sh "$stage/gw.sh"
          install -m 0644 LICENSE "$stage/LICENSE"
          install -m 0644 README.md "$stage/README.md"
          tar -czf "${name}.tar.gz" -C "$stage" .
          rm -rf "$stage"
          # The installer reads "<hash>  <name>" and checks the name matches.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "gw-${TAG}-${TARGET}.tar.gz" \
            "gw-${TAG}-${TARGET}.tar.gz.sha256" \
            --clobber
